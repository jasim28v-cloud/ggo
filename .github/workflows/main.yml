def progress_bar(duration=120, msg="🔄 جاري التحديث"):
    """شريط تقدم أثناء الكشط"""
    chars = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
    i = 0
    start = time.time()
    while time.time() - start < duration:
        elapsed = time.time() - start
        pct = min(100, int(elapsed / duration * 100))
        bar = "█" * (pct // 5) + "░" * (20 - pct // 5)
        sys.stdout.write(f"\r{msg} [{bar}] {pct}% {chars[i % len(chars)]}")
        sys.stdout.flush()
        i += 1
        time.sleep(0.1)
    print()

def job():
    print(f"\n{'='*50}")
    print(f"⏰ [{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] بدء الكشط الدوري...")
    print(f"{'='*50}")
